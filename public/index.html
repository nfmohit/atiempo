<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ovibus</title>
  <meta name="description" content="Plan trips on Oviedo city buses (TUA) with live arrival times.">
  <meta name="theme-color" content="#0b5c4b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Map"></div>

  <section id="panel" class="panel">
    <div class="grip" id="grip" aria-hidden="true"></div>
    <form id="search" class="search" autocomplete="off">
      <div class="field">
        <span class="dot from" aria-hidden="true"></span>
        <input id="from" type="text" placeholder="From: my location" aria-label="From">
        <button type="button" class="icon-btn" id="locate" title="Use my location" aria-label="Use my location">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
      <div class="field">
        <span class="dot to" aria-hidden="true"></span>
        <input id="to" type="text" placeholder="Where to?" aria-label="To">
        <button type="button" class="icon-btn" id="swap" title="Swap" aria-label="Swap from and to">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 4v14M3 14l4 4 4-4M17 20V6M13 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
      <ul id="suggest" class="suggest" role="listbox" hidden></ul>
      <div class="row">
        <select id="when" aria-label="When">
          <option value="now">Leave now</option>
          <option value="at">Leave at…</option>
        </select>
        <input id="time" type="time" hidden aria-label="Departure time">
        <input id="date" type="date" hidden aria-label="Departure date">
        <span class="hint" id="maphint">Tip: tap the map to set where you're going.</span>
      </div>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <ol id="results" class="results"></ol>
    <div id="detail" class="detail" hidden></div>
    <footer class="foot">
      Timetable: Consorcio de Transportes de Asturias open data. Live times: TUA. Map ©
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.
    </footer>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="app.js"></script>
</body>
</html>
